# AskTHIH HVAC Staging Route - Nginx Reverse Proxy Configuration
#
# This is an EXAMPLE configuration for protecting the local webhook server
# behind HTTPS and rate limiting.
#
# DO NOT use directly in production without:
# 1. Verifying SSL certificates are valid
# 2. Setting appropriate rate limits for your use case
# 3. Configuring upstream servers for your environment
# 4. Testing thoroughly in a staging environment
# 5. Ensuring all security headers are appropriate
#
# Usage:
# - Copy to /etc/nginx/sites-available/askthih-hvac-staging
# - Customize domain, certificate paths, upstream server
# - Enable: ln -s /etc/nginx/sites-available/askthih-hvac-staging /etc/nginx/sites-enabled/
# - Test: nginx -t
# - Reload: systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=hvac_intake:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hvac_burst:10m rate=20r/5s;

# Upstream webhook server (localhost:8787)
upstream askthih_hvac_webhook {
    server 127.0.0.1:8787 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name askthih.com www.askthih.com;

    location /hvac-staging {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - AskTHIH HVAC Staging Route
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name askthih.com www.askthih.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/askthih.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askthih.com/privkey.pem;

    # TLS 1.2 minimum
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS - Strict Transport Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; form-action 'none'" always;

    # Disable directory listing
    autoindex off;

    # HVAC Staging Route
    location /hvac-staging {
        # Rate limiting
        limit_req zone=hvac_intake burst=20 nodelay;

        # Only POST allowed
        limit_except POST {
            deny all;
        }

        # Request size limits
        client_max_body_size 10k;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Proxy settings
        proxy_pass http://askthih_hvac_webhook/askthih/hvac;
        proxy_http_version 1.1;

        # Preserve original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;

        # Keep-alive connections
        proxy_set_header Connection "";

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Error handling
        proxy_intercept_errors off;
    }

    # Deny all other locations
    location / {
        return 403;
    }

    # Security endpoint (optional)
    location /.well-known/security.txt {
        return 404;
    }

    # Log format
    access_log /var/log/nginx/askthih-hvac-staging-access.log combined buffer=32k;
    error_log /var/log/nginx/askthih-hvac-staging-error.log warn;
}

# Notes for AWS ALB / Elastic Load Balancer:
#
# Equivalent configuration for AWS:
# - Target Group: askthih-hvac-webhook
#   - Protocol: HTTP
#   - Port: 8787
#   - Path: /askthih/hvac
#   - Health Check: GET / (port 8787)
#
# - Listener Rule (Port 443):
#   - Host header: askthih.com OR www.askthih.com
#   - Path: /hvac-staging
#   - Forward to: askthih-hvac-webhook
#   - Rate limiting: AWS WAF rule (10 req/s per IP)
#
# - Security Group:
#   - Inbound: 443 (HTTPS) from 0.0.0.0/0 (public)
#   - Inbound: 8787 (HTTP) from ALB security group only
#   - Outbound: 8787 (HTTP) to webhook server

# Notes for Cloudflare / Reverse Proxy:
#
# - Create DNS CNAME: askthih.com -> [your-nginx-or-alb-domain]
# - Proxy: ON (orange cloud icon)
# - SSL/TLS: Full (Strict recommended)
# - Rate Limiting: 10 requests per 10 seconds per IP
# - WAF Rules: Block non-POST to /hvac-staging
# - Security Headers: Enable all (Cloudflare managed)

# Notes for Docker / Kubernetes:
#
# - Reverse proxy sidecar or separate service
# - nginx image: nginx:1.25-alpine
# - Mount config from ConfigMap
# - Service type: ClusterIP (internal)
# - Ingress: Handle HTTPS termination
# - Network policy: Restrict webhook to proxy only

# Troubleshooting:
#
# Test configuration:
#   sudo nginx -t
#
# Reload:
#   sudo systemctl reload nginx
#
# Check logs:
#   tail -f /var/log/nginx/askthih-hvac-staging-access.log
#   tail -f /var/log/nginx/askthih-hvac-staging-error.log
#
# Test rate limiting:
#   for i in {1..15}; do curl -X POST https://askthih.com/hvac-staging -d '{}'; done
#
# Monitor upstream:
#   curl -v https://askthih.com/hvac-staging
